<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mural de Contatos Persistente 📞</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mural de Contatos Persistente 📞</h1>
    <p>Agenda Desktop conectada ao SQLite</p>
  </header>

  <form id="form-contato">
    <div>
      <input type="text" id="nome" placeholder="Nome Completo" required>
      <input type="email" id="email" placeholder="E-mail (Único)" required>
    </div>
    <div>
      <input type="url" id="foto-url" placeholder="Link da Foto (URL)" required>
      <input type="tel" id="telefone" placeholder="Telefone (WhatsApp)" required>
    </div>
    <button type="submit">Cadastrar Contato</button>
  </form>

  <hr>

  <h2>Contatos Salvos:</h2>
  <!-- Contêiner que receberá os cards dinâmicos -->
  <div id="mural-contatos">
    <!-- Cards serão injetados aqui -->
  </div>

  <script src="renderer.js"></script>
</body>
</html>
